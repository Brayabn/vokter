# VØKTER — instalación y demostración LOCAL con Docker.
#
#   docker compose up --build        →  Web  http://localhost:8080
#                                       API  http://localhost:4100/api
#
# Funciona sin crear ningún archivo .env (todos los valores tienen un default de
# desarrollo). Para cambiarlos, copia .env.example como .env.
#
# Producción NO usa este archivo: Web → Vercel, API → Render, BD → Neon.

name: vokter

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vokter}
      POSTGRES_USER: ${POSTGRES_USER:-vokter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vokter_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # los datos sobreviven a "docker compose down"
    # Sin "ports": solo el backend la usa, dentro de la red de Docker. Así no
    # choca con un PostgreSQL instalado en el equipo (puerto 5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vokter]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-vokter}:${POSTGRES_PASSWORD:-vokter_local_password}@database:5432/${POSTGRES_DB:-vokter}
      DATABASE_SSL: "false"            # PostgreSQL local sin TLS (Neon, en producción, sí usa TLS)
      JWT_SECRET: ${JWT_SECRET:-solo_para_docker_local_no_usar_en_produccion}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      SEED_DEMO_DATA: "true"           # datos demo al arrancar (idempotente: no duplica)
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      database:
        condition: service_healthy     # espera a que PostgreSQL acepte conexiones
    healthcheck:
      # /api/health también comprueba la conexión a la base de datos
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [vokter]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api             # mismo origen: nginx reenvía /api → backend:4100
        VITE_APK_URL: ${VITE_APK_URL:-https://github.com/Brayabn/vokter/releases/download/v1.0.0/VOKTER-Android-v1.0.0.apk}
        VITE_APK_VERSION: ${VITE_APK_VERSION:-1.0.0}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [vokter]
    restart: unless-stopped

networks:
  vokter:

volumes:
  postgres_data:

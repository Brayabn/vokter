# nginx de la instalación local con Docker: sirve la web y reenvía /api al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: mismo origen para el navegador; "backend" solo existe en la red de Docker.
    location /api/ {
        proxy_pass http://backend:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta (/explorar, /descarga, /experto/3...) sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
